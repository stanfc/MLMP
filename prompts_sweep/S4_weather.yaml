# S4 — ADVERSE WEATHER (N=7, weather-AGNOSTIC union). Templates name the adverse
# conditions collectively (fog/night/rain/snow/low-light), NOT per-sample — this is
# legitimate in CTTA (the condition SET is known, not each image's label).
# Hypothesis: condition-aware anchors help the collapse regime (ACDC/Cityscapes) by
# pre-aligning the text space with the degraded visual distribution. OFF-domain for VOC.
prompt_templates:
  - "a photo of a {} in foggy weather."
  - "a photo of a {} at night."
  - "a photo of a {} in the rain."
  - "a photo of a {} in the snow."
  - "a photo of a {} in bad weather."
  - "a photo of a {} in low light."
  - "a photo of a {} under adverse conditions."
